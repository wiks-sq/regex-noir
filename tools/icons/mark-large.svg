  <g stroke="#ebe2d0" stroke-width="3.6" stroke-linecap="round">
    <line x1="10" y1="46" x2="17" y2="18"/>
    <line x1="47" y1="46" x2="54" y2="18"/>
  </g>
  <circle cx="24.5" cy="42" r="4.2" fill="#fbf7ef"/>
  <g stroke="#fbf7ef" stroke-width="4.6" stroke-linecap="round" transform="translate(35 28)">
    <line x1="0" y1="-8.5" x2="0" y2="8.5"/>
    <line x1="0" y1="-8.5" x2="0" y2="8.5" transform="rotate(60)"/>
    <line x1="0" y1="-8.5" x2="0" y2="8.5" transform="rotate(120)"/>
