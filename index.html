    .zero { display: inline-block; width: 2px; height: 1.1em; vertical-align: text-bottom; background: var(--warn); margin: 0 -1px; animation: blink 1s steps(2) infinite; }
    .nl-hit { background: var(--mark-bg); color: var(--mark-text); opacity: .7; border-radius: 2px; font-size: 10px; padding: 0 2px; }
    @keyframes blink { 50% { opacity: 0 } }

    .console { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; font-family: "JetBrains Mono", monospace; font-size: 12.5px; }
    .console-log { max-height: 190px; overflow: auto; }

    .kbd { font-family: "JetBrains Mono", monospace; font-size: 11px; border: 1px solid var(--border); border-bottom-width: 2px; padding: 0 .35rem; border-radius: 5px; color: var(--muted); }

    .tok { font-family: "JetBrains Mono", monospace; color: var(--accent); background: var(--panel2); border: 1px solid var(--border); padding: 0 .35rem; border-radius: 5px; white-space: pre; }

    .modal-back { position: fixed; inset: 0; background: rgba(45, 42, 36, .35); backdrop-filter: blur(2px); z-index: 70; display: flex; align-items: center; justify-content: center; padding: 16px; animation: fade .2s ease; }
    .modal { max-height: calc(100vh - 32px); overflow: auto; width: 100%; animation: pop .25s cubic-bezier(.2, 1.3, .5, 1); }
    @keyframes fade { from { opacity: 0 } }
    @keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.97) } }

    .shake { animation: shake .4s; }
    @keyframes shake { 20%, 60% { transform: translateX(-6px) } 40%, 80% { transform: translateX(6px) } }

    .stamp { display: inline-block; border: 3px solid var(--ok); color: var(--ok); font-family: "JetBrains Mono", monospace; font-weight: 700; letter-spacing: .2em; padding: .3rem .9rem; transform: rotate(-4deg); border-radius: 6px; }

    .scroll-x { overflow-x: auto; }

    details > summary { list-style: none; cursor: pointer; }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* =====================================================================
   CONFIG
   ===================================================================== */
const BMC_URL = "https://buymeacoffee.com/marginnotes";
const STORAGE_KEY = "regexNoir.v1";
const MAX_MATCHES = 2000;

/* =====================================================================
   CASE DATA
   Each case follows the schema from the spec, plus a few extras:
   - lines        : array of target-text lines (joined into targetText)
   - matchMode    : "full" (compare match[0]) or "group" (compare capture group 1)
   - startFlags   : flags toggled on when the case opens
   - objectives   : bullet list shown in the dossier
   - cheats       : [token, description] pairs for the cheat sheet
   - officer      : briefing officer note
   - timeLimit    : (seconds) optional par time for a speed bonus
   ===================================================================== */
/*CASES_START*/
const CASES = [
  {
    id: "case-01",
    title: "Operation: Phantom Ping",
    chapter: "Character Classes & Literals",
    difficulty: "Novice",
    briefing: "Rogue nodes are sending unauthorized pings across the grid. We need to isolate all occurrences of the keyword 'PHANTOM' followed by any 3 digits.",
    officer: { name: "Sgt. Okafor", note: "Rookie, start simple. Letters in a pattern match themselves. A backslash-d stands in for any single digit. Ignore the ERR line — it's a decoy." },
    objectives: [
      "Match every PHANTOM_ tag that ends in exactly three digits.",
      "Do not match the corrupted PHANTOM_ERR record.",
    ],
    lines: [
      "LOG 08:00: NORMAL_PING_101",
      "LOG 08:01: PHANTOM_942 DETECTED",
      "LOG 08:02: NORMAL_PING_102",
      "LOG 08:05: PHANTOM_108 DETECTED",
      "LOG 08:09: PHANTOM_ERR DETECTED",
    ],
    solutionPattern: String.raw`PHANTOM_\d{3}`,
    flags: "g",
    startFlags: "g",
    matchMode: "full",
    expectedMatches: ["PHANTOM_942", "PHANTOM_108"],
    hint: "Use \\d to match single digits and {3} to specify exactly three occurrences.",
    conceptUnlocked: "Digits (\\d) & Quantifiers ({n})",
    cheats: [
      ["abc", "Literal characters match themselves exactly"],
      ["\\d", "Any digit 0–9"],
      ["\\w", "Any word character: letter, digit or _"],
      ["\\s", "Any whitespace (space, tab, newline)"],
      ["{3}", "Exactly 3 of the previous token"],
      ["g flag", "Global — find every match, not just the first"],
    ],
  },
  {
    id: "case-02",
    title: "The Counterfeit Serials",
    chapter: "Wildcards & Quantifiers",
    difficulty: "Novice",
    briefing: "A smuggling ring is flooding Dock Bay with cloned hardware. Genuine units carry the tag SN, one separator character of any kind, and at least two digits. Forgeries skimp on the digits or double up separators.",
    officer: { name: "Sgt. Okafor", note: "The dot is a wildcard — it matches any single character except a newline. Pair it with a quantifier like {2,} and you can say \"two or more\"." },
    objectives: [
      "Match SN + any ONE separator + two or more digits.",
      "Reject SN-7 (too few digits), SN--12 (double separator) and SNX.",
      "Match only the serial itself — not the status text.",
    ],
    lines: [
      "[BAY-01] SN-4471   status=GREEN",
      "[BAY-02] SN#88     status=GREEN",
      "[BAY-03] SN-7      status=FAULT",
      "[BAY-04] SN.3310   status=GREEN",
      "[BAY-05] SN--12    status=FAULT",
      "[BAY-06] SN:90215  status=GREEN",
      "[BAY-07] SNX       status=NULL",
    ],
    solutionPattern: String.raw`SN.\d{2,}`,
    flags: "g",
    startFlags: "g",
    matchMode: "full",
    expectedMatches: ["SN-4471", "SN#88", "SN.3310", "SN:90215"],
    hint: "Start with SN, add a single dot for the separator, then \\d{2,} for two-or-more digits. \\d+ alone would also let SN-7 through.",
    conceptUnlocked: "Wildcard (.) & Range Quantifiers ({n,})",
    cheats: [
      [".", "Any single character except newline"],
      ["*", "0 or more of the previous token"],
      ["+", "1 or more of the previous token"],
      ["?", "0 or 1 (optional)"],
      ["{2,}", "2 or more"],
      ["{2,4}", "Between 2 and 4"],
      ["\\.", "A literal dot (escaped)"],
    ],
  },
  {
    id: "case-03",
    title: "Signatures in the Static",
    chapter: "Anchors & Word Boundaries",
    difficulty: "Apprentice",
    briefing: "Our relay recorded a handshake session riddled with echoes. Real signature headers start a line with the standalone word SIG. Echoes appear mid-line, and lookalikes such as SIGNAL or SIG_DEBUG must be thrown out. Pull each genuine header line in full.",
    officer: { name: "Insp. Varga", note: "^ and $ pin you to the start and end. By default they mean the whole text — flip on the m flag so they mean each line. \\b marks the edge of a word." },
    objectives: [
      "Match entire lines that begin with the standalone word SIG.",
      "Ignore SIGNAL, SIG_DEBUG and the forwarded mid-line echo.",
      "Each match must run from the start of the line to its end.",
    ],
    lines: [
      "SIG alpha-7 handshake",
      "SIGNAL boost requested",
      "relay SIG beta-2 forwarded",
      "SIG omega-9 handshake",
      "SIG_DEBUG trace enabled",
      "SIG",
      "  SIG gamma-1 malformed",
    ],
    solutionPattern: String.raw`^SIG\b.*$`,
    flags: "gm",
    startFlags: "g",
    matchMode: "full",
    expectedMatches: ["SIG alpha-7 handshake", "SIG omega-9 handshake", "SIG"],
    hint: "Try ^SIG\\b.*$ — and enable the m (multiline) flag, otherwise ^ only matches the very first character of the log.",
    conceptUnlocked: "Anchors (^ $), Multiline (m) & Boundaries (\\b)",
    cheats: [
      ["^", "Start of text (or of each line with m)"],
      ["$", "End of text (or of each line with m)"],
      ["\\b", "Word boundary — between \\w and non-\\w"],
      ["\\B", "Not a word boundary"],
      [".*", "Anything (greedy) up to the line end"],
      ["m flag", "Multiline: ^ and $ work per line"],
    ],
  },
  {
    id: "case-04",
    title: "Hash Ledger Audit",
    chapter: "Character Sets & Ranges",
    difficulty: "Apprentice",
    briefing: "The Cinder Bank ledger has been tampered with. Valid transaction hashes are exactly eight lowercase hexadecimal characters (0–9, a–f). Anything longer, shorter, uppercase or containing non-hex letters is a forgery.",
    officer: { name: "Insp. Varga", note: "Square brackets build a custom alphabet. [a-f0-9] means one character from that set. Wrap the whole thing in word boundaries so you don't grab a slice of a longer string." },
    objectives: [
      "Match only the hash values that are exactly 8 lowercase hex characters.",
      "Reject the 9-character hash, the uppercase hash and anything containing g–z.",
    ],
    lines: [
      "tx#001 hash=3fa9c01b  verdict=ok",
      "tx#002 hash=zz19ab0c  verdict=bad",
      "tx#003 hash=0011aaff  verdict=ok",
      "tx#004 hash=12ab34cd5 verdict=bad",
      "tx#005 hash=A1B2C3D4  verdict=bad",
      "tx#006 hash=deadbeef  verdict=ok",
      "tx#007 hash=9g8f7e6d  verdict=bad",
    ],
    solutionPattern: String.raw`\b[a-f0-9]{8}\b`,
    flags: "g",
    startFlags: "g",
    matchMode: "full",

let audioCtx = null;
function beep(kind, enabled) {
  if (!enabled) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const seqs = {
      click: [[880, 0.04, "square", 0.03]],
      analyze: [[520, 0.06, "sine", 0.06], [780, 0.08, "sine", 0.05]],
      fail: [[220, 0.14, "sawtooth", 0.06], [160, 0.22, "sawtooth", 0.06]],
      win: [[523, 0.1, "triangle", 0.08], [659, 0.1, "triangle", 0.08], [784, 0.1, "triangle", 0.08], [1047, 0.28, "triangle", 0.08]],
      error: [[140, 0.08, "square", 0.03]],
    };
    let t = audioCtx.currentTime;
    (seqs[kind] || seqs.click).forEach(([f, d, type, vol]) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + d + 0.02);
      t += d * 0.9;
    });
  } catch (e) { /* audio unsupported */ }
}

/* =====================================================================
   REGEX ENGINE WRAPPER
   ===================================================================== */
const HAS_INDICES = (() => { try { new RegExp("a", "d"); return true; } catch (e) { return false; } })();

function friendlyError(msg) {
  const m = String(msg);
  const rules = [
    [/Unterminated group|missing \)/i, "Unclosed parenthesis — every ( needs a matching )."],
    [/Unmatched '\)'|unmatched parentheses/i, "Stray ) — there's a closing parenthesis with no opening (."],
    [/Unterminated character class|missing \]/i, "Unclosed character set — every [ needs a matching ]."],
    [/Nothing to repeat/i, "A quantifier (*, +, ?, {n}) has nothing before it to repeat. Escape it with \\ if you meant the literal character."],
    [/Invalid group/i, "Invalid group syntax — check the characters right after (? ."],
    [/numbers out of order/i, "Quantifier range is backwards — {min,max} needs min ≤ max."],
    [/range out of order/i, "Character range is backwards — use [a-z], not [z-a]."],
    [/\\ at end of pattern|trailing backslash/i, "Pattern ends with a lone backslash — escape something, or remove it."],
    [/Invalid escape/i, "Invalid escape sequence."],
    [/Lone quantifier/i, "Unbalanced { } quantifier braces."],
  ];
  for (const [re, txt] of rules) if (re.test(m)) return txt;
  return "Syntax error in pattern.";
}

function runRegex(pattern, flags, text) {
  if (!pattern) return { status: "idle", matches: [] };
  let re;
  try {
    new RegExp(pattern, flags); // validate with the user's flags only, so error text matches what they typed
    re = new RegExp(pattern, flags + (HAS_INDICES ? "d" : ""));
  } catch (e) {
    return { status: "error", error: friendlyError(e.message), raw: e.message, matches: [] };
  }
  const matches = [];
  let truncated = false, slow = false;
  const t0 = performance.now();
  const toM = (m) => ({
    text: m[0], index: m.index, end: m.index + m[0].length,
    groups: Array.from(m).slice(1),
    gIdx: m.indices && m.indices[1] ? m.indices[1] : null,
  });
  if (!flags.includes("g")) {
    const m = re.exec(text);
    if (m) matches.push(toM(m));
  } else {
    re.lastIndex = 0;
    let m;
    while ((m = re.exec(text)) !== null) {
      matches.push(toM(m));
      if (m[0].length === 0) re.lastIndex++;
      if (matches.length >= MAX_MATCHES) { truncated = true; break; }
      if (performance.now() - t0 > 300) { slow = true; break; }
    }
  }
  return { status: "ok", matches, truncated, slow, groupCount: (new RegExp("(?:" + pattern + ")|", flags.replace("g", ""))).exec("").length - 1 };
}

function evaluate(c, result) {
  const actual = result.matches.map((m) => (c.matchMode === "group" ? (m.groups[0] === undefined ? "∅" : m.groups[0]) : m.text));
  const expected = c.expectedMatches;
  const exact = actual.length === expected.length && actual.every((a, i) => a === expected[i]);
  // multiset diff for diagnostics
  const pool = [...expected];
  const extras = [];
  actual.forEach((a) => { const i = pool.indexOf(a); if (i >= 0) pool.splice(i, 1); else extras.push(a); });
  return { actual, exact, missing: pool, extras, hits: expected.length - pool.length };
}

/* =====================================================================
   REGEX EXPLAINER (for the victory breakdown)
   ===================================================================== */
function explainRegex(src) {
  const out = [];
  let i = 0, groupNo = 0;
  const escMap = {
    d: "any digit (0–9)", D: "any non-digit", w: "a word character (letter, digit, _)", W: "a non-word character",
    s: "whitespace", S: "a non-whitespace character", b: "a word boundary", B: "a non-boundary position",
    n: "a newline", t: "a tab", r: "a carriage return",
  };
  const pushLit = (ch) => {
    const last = out[out.length - 1];
    if (last && last.kind === "lit") { last.tok += ch; last.desc = `literal text "${last.raw + ch}"`; last.raw += ch; }
    else out.push({ kind: "lit", tok: ch, raw: ch, desc: `literal text "${ch}"` });
  };
  while (i < src.length) {
    const ch = src[i];
    if (ch === "\\") {
      const n = src[i + 1] ?? "";
      if (/[1-9]/.test(n)) { out.push({ tok: "\\" + n, desc: `backreference — the same text captured by group ${n}` }); }
      else if (escMap[n]) { out.push({ tok: "\\" + n, desc: escMap[n] }); }
      else { pushLit(n); out[out.length - 1].tok = out[out.length - 1].tok.slice(0, -1) + "\\" + n; }
      i += 2; continue;
    }
    if (ch === "[") {
      let j = i + 1;
      if (src[j] === "^") j++;
      if (src[j] === "]") j++;
      while (j < src.length && src[j] !== "]") { if (src[j] === "\\") j++; j++; }
      const tok = src.slice(i, j + 1);
      const neg = tok[1] === "^";
      out.push({ tok, desc: neg ? `any ONE character NOT in the set ${tok.slice(2, -1)}` : `any ONE character from the set ${tok.slice(1, -1)}` });
      i = j + 1; continue;
    }
    if (ch === "(") {
      const look = src.slice(i, i + 4);
      if (look.startsWith("(?:")) { out.push({ tok: "(?:", desc: "start a non-capturing group" }); i += 3; continue; }
      if (look.startsWith("(?=")) { out.push({ tok: "(?=", desc: "positive lookahead — what follows must match…" }); i += 3; continue; }
      if (look.startsWith("(?!")) { out.push({ tok: "(?!", desc: "negative lookahead — what follows must NOT match…" }); i += 3; continue; }
      if (look.startsWith("(?<=")) { out.push({ tok: "(?<=", desc: "positive lookbehind — what precedes must match…" }); i += 4; continue; }
      if (look.startsWith("(?<!")) { out.push({ tok: "(?<!", desc: "negative lookbehind — what precedes must NOT match…" }); i += 4; continue; }
      const named = src.slice(i).match(/^\(\?<([A-Za-z_]\w*)>/);
      groupNo++;
      if (named) { out.push({ tok: named[0], desc: `start capture group ${groupNo} named "${named[1]}"` }); i += named[0].length; continue; }
      out.push({ tok: "(", desc: `start capture group ${groupNo}` }); i++; continue;
    }
    if (ch === ")") { out.push({ tok: ")", desc: "end group" }); i++; continue; }
    if (ch === "*" || ch === "+" || ch === "?" || ch === "{") {
      let tok = ch, desc;
      if (ch === "{") {
        const m = src.slice(i).match(/^\{(\d+)(,(\d*))?\}/);
        if (!m) { pushLit(ch); i++; continue; }
        tok = m[0];
        desc = !m[2] ? `exactly ${m[1]} times` : m[3] === "" ? `${m[1]} or more times` : `between ${m[1]} and ${m[3]} times`;
      } else desc = { "*": "zero or more times", "+": "one or more times", "?": "optional (zero or one time)" }[ch];
      i += tok.length;
      if (src[i] === "?") { tok += "?"; desc += " — lazy (as few as possible)"; i++; }
      else if (ch !== "?" || tok.length > 1) desc += ch === "?" ? "" : " — greedy";
      out.push({ tok, desc: "↳ repeat previous " + desc });
      continue;
    }
    if (ch === "^") { out.push({ tok: "^", desc: "anchor: start of the line/text" }); i++; continue; }
    if (ch === "$") { out.push({ tok: "$", desc: "anchor: end of the line/text" }); i++; continue; }
    if (ch === ".") { out.push({ tok: ".", desc: "any single character except newline" }); i++; continue; }
    if (ch === "|") { out.push({ tok: "|", desc: "OR — alternatively match what follows" }); i++; continue; }
    pushLit(ch); i++;
  }
  return out;
}

function Modal({ children, onClose, labelledBy, wide }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape" && onClose) onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);
  return (
    <div className="modal-back" onMouseDown={(e) => { if (e.target === e.currentTarget && onClose) onClose(); }}>
      <div role="dialog" aria-modal="true" aria-labelledby={labelledBy} className={"panel modal p-5 sm:p-7 " + (wide ? "max-w-2xl" : "max-w-md")}>
        {children}
      </div>
    </div>
  );
}

function fmtTime(s) {
  s = Math.max(0, Math.round(s));
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}

/* =====================================================================
   DATA FEED (highlighted target text)
   ===================================================================== */
function DataFeed({ text, matches, showGroup }) {
  const lines = text.split("\n").length;
  const nodes = useMemo(() => {
    const out = [];
    let pos = 0;
    matches.forEach((m, k) => {
      if (m.index < pos) return;
      if (m.index > pos) out.push(text.slice(pos, m.index));
      if (m.end === m.index) { out.push(<span key={"z" + k} className="zero" title="zero-length match" />); pos = m.index; return; }
      const parts = [];
      const g = showGroup && m.gIdx && m.gIdx[0] >= m.index && m.gIdx[1] <= m.end ? m.gIdx : null;
      const seg = (s, e, key, cls) => {
        const str = text.slice(s, e);
        // render newlines inside a match visibly
        const bits = str.split("\n");
        return bits.flatMap((b, bi) => (bi === 0 ? [b] : [<span key={key + "n" + bi} className="nl-hit">↵</span>, "\n", b]))
          .map((x, xi) => (typeof x === "string" && cls ? <mark key={key + xi} className={cls}>{x}</mark> : x));
      };
      if (g && g[1] > g[0]) {
        parts.push(...seg(m.index, g[0], "a", null));
        parts.push(<mark key="g" className="grp">{text.slice(g[0], g[1])}</mark>);
        parts.push(...seg(g[1], m.end, "b", null));
      } else {
        parts.push(...seg(m.index, m.end, "c", null));
      }
      out.push(<mark key={"m" + k} className={"hit" + (k % 2 ? " alt" : "")} title={`match ${k + 1}`}>{parts}</mark>);
      pos = m.end;
    });
    if (pos < text.length) out.push(text.slice(pos));
    return out;
  }, [text, matches, showGroup]);

  return (
    <div className="feed" tabIndex={0} aria-label="Target data feed">
      <div className="feed-inner">
        <div className="gutter" aria-hidden="true">
          {Array.from({ length: lines }, (_, i) => <div key={i}>{String(i + 1).padStart(2, "0")}</div>)}
        </div>
        <pre>{nodes}</pre>
      </div>
    </div>
  );
}

          </span>
        </div>
        <div className="px-3 py-2">
          {err && (
            <div className="err">
              <div>✖ {result.error}</div>
              <div className="muted text-[11px] mt-1">engine: {result.raw}</div>
            </div>

              {result.slow && <div className="warn">⚠ Execution throttled — pattern is backtracking heavily.</div>}
              {count === 0 ? <div className="muted">No matches in the feed.</div> : (
                <div className="scroll-x">
                  <table className="text-left w-full">
                    <thead><tr className="muted text-[11px] uppercase tracking-wider">
                      <th className="pr-3 font-normal">#</th><th className="pr-3 font-normal">match</th>
                      {Array.from({ length: Math.min(result.groupCount, 3) }, (_, g) => <th key={g} className="pr-3 font-normal">grp {g + 1}</th>)}
                      <th className="font-normal">@</th>

                    <tbody>
                      {result.matches.slice(0, 8).map((m, k) => (
                        <tr key={k}>

                      ))}

          )}
        </div>
        {logs.length > 0 && (
          <div className="console-log px-3 py-2 space-y-1" style={{ borderTop: "1px solid var(--border)" }}>
            {logs.map((l) => (
              <div key={l.id} className={l.kind}><span className="muted">[{l.time}]</span> {l.text}</div>
            ))}
          </div>
        )}
      </div>
    </section>
  );
}

function downloadEmblem(svgEl) {
  if (!svgEl) return;
  const xml = new XMLSerializer().serializeToString(svgEl);
  const url = URL.createObjectURL(new Blob([xml], { type: "image/svg+xml;charset=utf-8" }));
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement("canvas");
    canvas.width = canvas.height = 1200;
    canvas.getContext("2d").drawImage(img, 0, 0, 1200, 1200);
    URL.revokeObjectURL(url);
    canvas.toBlob((blob) => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "regex-noir-master-cryptanalyst.png";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    }, "image/png");
  };
  img.src = url;
}

      <div className="panel2 p-3 mt-4" style={{ borderColor: "var(--warn)" }}>
        <div className="label" style={{ color: "var(--warn)" }}>Concept Unlocked</div>
        <div className="font-bold mt-1">{c.conceptUnlocked}</div>
      </div>

      {showSupport && <div className="mt-4"><SupportCard title={`${solvedTotal} cases closed`} text="You're on a streak, detective. If Regex Noir is helping you level up, a coffee keeps new cases coming." /></div>}

      <div className="flex gap-2 mt-5 justify-end flex-wrap">
        <button className="btn" onClick={onClose}>Review Case</button>
        {solvedTotal >= CASES.length && (last || !onNext)
          ? <button className="btn btn-primary" onClick={onClaim} autoFocus>♛ Claim Your Badge</button>
          : !last ? <button className="btn btn-primary" onClick={onNext} autoFocus>Next Case ▸</button>
          : <button className="btn btn-primary" onClick={onClose} autoFocus>Close</button>}
      </div>
    </Modal>
  );
}

/* =====================================================================
   APP
   ===================================================================== */
let logId = 0;
function App() {
  const [progress, setProgress] = useState(loadProgress);
  const [current, setCurrent] = useState(() => {
    const p = loadProgress();
    const i = Math.min(Math.max(0, p.current | 0), CASES.length - 1);
    return isUnlocked(p, i) ? i : 0;
  });
  const c = CASES[current];
  const draft = progress.drafts[c.id] || { pattern: "", flags: c.startFlags };
  const [pattern, setPatternState] = useState(draft.pattern);
  const [flags, setFlags] = useState(draft.flags);
  const [logs, setLogs] = useState([]);
  const [victory, setVictory] = useState(null);
  const [confirmReset, setConfirmReset] = useState(false);
  const [showMaster, setShowMaster] = useState(false);
  const [shake, setShake] = useState(false);
  const [now, setNow] = useState(Date.now());
  const inputRef = useRef(null);
  const sound = progress.settings.sound;

  const session = progress.sessions[c.id] || { failed: 0, hintUsed: false, revealed: false, start: null };

  // persist
  useEffect(() => { saveProgress(progress); }, [progress]);
  useEffect(() => { document.documentElement.setAttribute("data-theme", progress.settings.theme); }, [progress.settings.theme]);

  // switching case → load draft, start session timer
  useEffect(() => {
    const d = progress.drafts[c.id] || { pattern: "", flags: c.startFlags };
    setPatternState(d.pattern);
    setFlags(d.flags);
    setLogs([]);
    setProgress((p) => {
      const s = p.sessions[c.id];
      const next = { ...p, current };
      if (!s || !s.start) next.sessions = { ...p.sessions, [c.id]: { failed: 0, hintUsed: false, revealed: false, ...(s || {}), start: Date.now() } };
      return next;
    });
    // eslint-disable-next-line
  }, [current]);

  // timer tick (only for timed cases)
  useEffect(() => {
    if (!c.timeLimit || progress.solved[c.id]) return;
    const t = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(t);
  }, [current, c.timeLimit, progress.solved]);

  const saveDraft = (pt, fl) => setProgress((p) => ({ ...p, drafts: { ...p.drafts, [c.id]: { pattern: pt, flags: fl } } }));
  const setPattern = (v) => { setPatternState(v); saveDraft(v, flags); };
  const toggleFlag = (f) => {
    const nf = ["g", "i", "m"].filter((x) => (x === f ? !flags.includes(x) : flags.includes(x))).join("");
    setFlags(nf); saveDraft(pattern, nf); beep("click", sound);
  };

  const result = useMemo(() => runRegex(pattern, flags, c.targetText), [pattern, flags, c]);

  const log = (text, kind = "") => {
    const d = new Date();
    const time = [d.getHours(), d.getMinutes(), d.getSeconds()].map((n) => String(n).padStart(2, "0")).join(":");
    setLogs((l) => [{ id: ++logId, text, kind, time }, ...l].slice(0, 30));
  };

  const updateSession = (patch) => setProgress((p) => ({ ...p, sessions: { ...p.sessions, [c.id]: { ...session, ...(p.sessions[c.id] || {}), ...patch } } }));

  const analyze = () => {
    if (result.status === "idle") { log("No pattern loaded. Type a regex first.", "muted"); beep("error", sound); return; }
    if (result.status === "error") { log("✖ " + result.error, "err"); beep("error", sound); return; }
    const ev = evaluate(c, result);
    beep("analyze", sound);
    log(`◎ Signal analyzed: ${result.matches.length} match(es). ${ev.hits}/${c.expectedMatches.length} target items identified.`, "accent");
    if (ev.extras.length) log(`  ⚠ ${ev.extras.length} false positive(s): ${ev.extras.slice(0, 4).map((x) => JSON.stringify(x)).join(", ")}${ev.extras.length > 4 ? "…" : ""}`, "warn");
    if (ev.missing.length) log(`  ⚠ ${ev.missing.length} target item(s) still missing.`, "warn");
    if (ev.exact) log("  ✓ Evidence looks airtight. Submit when ready.", "ok");
    else if (!ev.extras.length && !ev.missing.length) log("  ⚠ Right items, wrong order or count — check your flags.", "warn");
  };

  const submit = () => {
    if (result.status !== "ok") { analyze(); return; }
    const ev = evaluate(c, result);
    if (!ev.exact) {
      const failed = (session.failed || 0) + 1;
      updateSession({ failed });
      setShake(true); setTimeout(() => setShake(false), 450);
      beep("fail", sound);
      let why = [];
      if (ev.missing.length) why.push(`${ev.missing.length} missing`);
      if (ev.extras.length) why.push(`${ev.extras.length} false positive(s)`);
      if (!why.length) why.push("order/count mismatch");
      log(`✖ Evidence rejected (${why.join(", ")}). Misfire #${failed}: −100.`, "err");
      if (c.matchMode === "group" && result.groupCount === 0) log("  ⓘ This case reads capture group 1 — your pattern has no capturing group.", "warn");
      if (failed === 3) log("  ⓘ Declassify option is now available in the Intel Drawer.", "muted");
      return;
    }
    // success
    const start = session.start || Date.now();
    const time = Math.round((Date.now() - start) / 1000);
    const breakdown = [["Base evidence value", 1000]];
    if (session.failed) breakdown.push([`Misfires ×${session.failed}`, -100 * session.failed]);
    if (session.hintUsed) breakdown.push(["Hint requested", -200]);
    if (session.revealed) breakdown.push(["Solution declassified", -500]);
    const efficient = pattern.length <= c.solutionPattern.length && !session.revealed;
    if (efficient) breakdown.push(["Efficiency bonus (≤ reference length)", 150]);
    let underPar = false;
    if (c.timeLimit) {
      underPar = time <= c.timeLimit;
      if (underPar) breakdown.push(["Under par time", Math.round(500 * (1 - time / c.timeLimit)) + 100]);
    }
    let score = Math.max(100, breakdown.reduce((s, [, v]) => s + v, 0));
    const prev = progress.solved[c.id];
    const record = {
      score: prev ? Math.max(prev.score, score) : score, lastScore: score, pattern, flags, time,
      failed: session.failed || 0, hintUsed: !!session.hintUsed, revealed: !!session.revealed,
      efficient: efficient || !!(prev && prev.efficient), underPar: underPar || !!(prev && prev.underPar), solvedAt: Date.now(),
    };
    const newSolved = { ...progress.solved, [c.id]: record };
    const total = CASES.filter((x) => newSolved[x.id]).length;
    setProgress((p) => ({ ...p, solved: newSolved, completedAt: p.completedAt || (total >= CASES.length ? Date.now() : undefined), sessions: { ...p.sessions, [c.id]: { failed: 0, hintUsed: false, revealed: false, start: null } } }));
    beep("win", sound);
    log(`✓ Evidence accepted. Case closed for ${score} points.`, "ok");
    setVictory({ c, idx: current, pattern, flags, breakdown, record: { ...record, score }, total });
  };

  const goNext = () => {
    setVictory(null);
    if (current < CASES.length - 1) setCurrent(current + 1);
    setTimeout(() => inputRef.current && inputRef.current.focus(), 50);
  };

  const insertToken = (t) => {
    const el = inputRef.current;
    if (!el) return setPattern(pattern + t);
    const s = el.selectionStart ?? pattern.length, e = el.selectionEnd ?? pattern.length;
    const v = pattern.slice(0, s) + t + pattern.slice(e);
    setPattern(v);
    requestAnimationFrame(() => { el.focus(); el.setSelectionRange(s + t.length, s + t.length); });
  };

  const doReset = () => {
    const fresh = structuredClone(DEFAULT_PROGRESS);
    fresh.settings = progress.settings;
    setProgress(fresh);
    setCurrent(0);
    setPatternState(""); setFlags(CASES[0].startFlags); setLogs([]);
    setConfirmReset(false);
    beep("fail", sound);
  };

  const timer = c.timeLimit && !progress.solved[c.id] && session.start
    ? { left: c.timeLimit - Math.floor((now - session.start) / 1000) } : null;

  const earned = BADGES.filter((b) => b.test(progress));
  const total = solvedCount(progress);
  const totalScore = Object.values(progress.solved).reduce((s, r) => s + (r.score || 0), 0);

  return (
    <div className="min-h-screen flex flex-col">
      <Header progress={progress}
        onReset={() => setConfirmReset(true)}
        onToggleSound={() => setProgress((p) => ({ ...p, settings: { ...p.settings, sound: !p.settings.sound } }))}
        onToggleTheme={() => setProgress((p) => ({ ...p, settings: { ...p.settings, theme: p.settings.theme === "light" ? "contrast" : "light" } }))} />

      <main className="max-w-7xl w-full mx-auto px-4 py-4 flex-1 flex flex-col gap-4">
        <div className="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
          <div className="min-w-0 flex-1"><CaseStrip progress={progress} current={current} onSelect={(i) => { setCurrent(i); beep("click", sound); }} /></div>
          <div className="flex items-center gap-3 font-mono text-xs muted shrink-0">
            <span>Total score <span className="accent font-bold">{totalScore}</span></span>
            <span>Badges <span className="warn font-bold">{earned.length}/{BADGES.length}</span></span>
          </div>
        </div>

        <div className="grid grid-cols-1 lg:grid-cols-[minmax(0,5fr)_minmax(0,7fr)] gap-4 items-start">
          <Dossier c={c} idx={current} session={session} solvedRec={progress.solved[c.id]}
            onHint={() => { updateSession({ hintUsed: true }); beep("click", sound); log("💡 Hint transmitted: −200 on this case.", "warn"); }}
            onReveal={() => { updateSession({ revealed: true }); beep("click", sound); log("🗝 Reference solution declassified: −500 on this case.", "err"); }}
            onInsert={insertToken} />
          <ConsolePanel c={c} pattern={pattern} setPattern={setPattern} flags={flags} toggleFlag={toggleFlag}
            result={result} logs={logs} onAnalyze={analyze} onSubmit={submit} shake={shake} timer={timer} inputRef={inputRef} />
        </div>

        <section className="panel p-4" aria-label="Badges">
          <div className="label mb-2">Commendations</div>
          <div className="flex flex-wrap gap-2">
            {BADGES.map((b) => {
              const has = earned.includes(b);
              return <span key={b.id} className={"badge " + (has ? "earned" : "")} title={b.desc}>{has ? b.icon : "·"} {b.name}</span>;
            })}
          </div>
        </section>

        {total >= CASES.length && (
          <section className="panel p-4 sm:p-5 flex flex-col sm:flex-row items-center gap-4" style={{ borderColor: "var(--accent)" }} aria-label="Final badge">
            <MasterEmblem score={totalScore} date={progress.completedAt} size={120} />
            <div className="flex-1 text-center sm:text-left">
              <div className="label accent">Final Commendation Earned</div>
              <div className="text-xl font-bold mt-1">Master Cryptanalyst</div>
              <p className="muted text-sm mt-1">All {CASES.length} cases closed with {totalScore} total points. Replay any case to improve your score.</p>
            </div>
            <button className="btn btn-primary" onClick={() => setShowMaster(true)}>♛ View Badge</button>
          </section>
        )}

        {total > 0 && total % 3 === 0 && !victory && (
          <SupportCard title={`Milestone · ${total} cases closed`} text="Another three cases in the bag. If you're enjoying the investigation, a coffee keeps the case files coming." />
        )}
      </main>

      <footer className="mt-6" style={{ background: "var(--secondary)", borderTop: "1px solid var(--border)" }}>
        <div className="max-w-7xl mx-auto px-4 py-6 flex flex-col md:flex-row gap-4 md:items-center justify-between">
          <div className="text-sm muted">
            <div><span className="accent font-bold">Regex Noir</span> // Signal &amp; Cipher — learn regular expressions one case at a time.</div>
            <div className="text-xs mt-1 font-mono">Progress is stored only in this browser (localStorage). No accounts, no tracking.</div>
          </div>
          <div className="flex items-center gap-3 flex-wrap">
            <a className="btn" href="cheatsheet.html">📖 Regex Cheat Sheet</a>
            <span className="label">Support Project</span>
            <CoffeeButton />
          </div>
        </div>
      </footer>

      {victory && <VictoryModal data={victory} solvedTotal={victory.total} onNext={goNext} onClose={() => setVictory(null)}
        onClaim={() => { setVictory(null); setShowMaster(true); }} />}

      {showMaster && <CompletionModal score={totalScore} date={progress.completedAt || Date.now()} onClose={() => setShowMaster(false)} />}

      {confirmReset && (
        <Modal onClose={() => setConfirmReset(false)} labelledBy="reset-title">
          <h3 id="reset-title" className="text-xl font-bold err">Burn all case files?</h3>
          <p className="muted text-sm mt-2 leading-relaxed">This erases every solved case, score, badge and saved draft from this browser. Your sound and theme settings are kept. This cannot be undone.</p>
          <div className="flex gap-2 justify-end mt-5">
            <button className="btn" onClick={() => setConfirmReset(false)} autoFocus>Cancel</button>
            <button className="btn" style={{ borderColor: "var(--err)", color: "var(--err)" }} onClick={doReset}>Reset Progress</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
